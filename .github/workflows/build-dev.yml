name: Build Dev Package

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Required for setuptools_scm to determine version from git tags

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          devscripts \
          debhelper \
          dh-python \
          python3-all \
          python3-pip \
          python3-yaml \
          python3-cherrypy3 \
          python3-paho-mqtt \
          python3-psutil \
          python3-jwt \
          python3-rrdtool \
          git \
          fakeroot

    - name: Install Python Build Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel setuptools_scm

    - name: Build Debian Package
      run: |
        chmod +x scripts/build-dev.sh
        ./scripts/build-dev.sh

    - name: Upload .deb Artifact
      uses: actions/upload-artifact@v4
      with:
        name: pymc-repeater-dev-deb
        path: |
          *.deb
          !*.dbgsym.deb
        if-no-files-found: error
        retention-days: 5
